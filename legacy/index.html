document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-weight: 800;\n  font-display: swap;\n  src: url(\"1fb23cb8-39ad-416d-8206-2edad727f700\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0}\n  *{box-sizing:border-box}\n  [contenteditable]{outline:none}\n  ::placeholder{color:#b8b2a7}\n  .ptm-scroll::-webkit-scrollbar{width:10px}\n  .ptm-scroll::-webkit-scrollbar-thumb{background:#e0dcd3;border-radius:20px;border:3px solid #fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f6f4ef;padding:32px 18px 60px;font-family:'Public Sans',system-ui,sans-serif;color:#22201d\">\n  <div style=\"max-width:760px;margin:0 auto\">\n\n    <div style=\"display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px 12px;margin-bottom:20px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;white-space:nowrap\">My Tasks<\u002Fh1>\n      <span style=\"font:500 12px 'JetBrains Mono',monospace;color:#a49e93;padding-bottom:2px\">{{ countLabel }}<\u002Fspan>\n      <div style=\"margin-left:auto;display:flex;gap:9px\">\n        <button onclick=\"{{ openSync }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:#fff;border:1px solid #e6e2da;border-radius:10px;font:600 12.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer;box-shadow:0 1px 2px rgba(31,29,27,.03)\" style-hover=\"background:#f4f1ea\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan>Sync<\u002Fbutton>\n        <button onclick=\"{{ openTags }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1px solid #e6e2da;border-radius:10px;font:600 12.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer;box-shadow:0 1px 2px rgba(31,29,27,.03)\" style-hover=\"background:#f4f1ea\">Manage tags<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:stretch;gap:10px;margin-bottom:14px\">\n      <button onclick=\"{{ openModal }}\" title=\"Add task\" style=\"{{ addBtnStyle }}\">\n        <span style=\"font-size:16px;line-height:1;margin-top:-1px\">+<\u002Fspan> Add task\n      <\u002Fbutton>\n      <div style=\"flex:1;display:flex;align-items:center;gap:9px;padding:9px 13px;background:#fff;border:1px solid #e6e2da;border-radius:11px;box-shadow:0 1px 2px rgba(31,29,27,.03)\">\n        <span style=\"color:#bdb7ab;font-size:15px\">⌕<\u002Fspan>\n        <input value=\"{{ search }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search tasks or tags…\" style=\"flex:1;border:none;outline:none;background:none;font:400 14px 'Public Sans',sans-serif;color:#22201d\">\n        <sc-if value=\"{{ hasSearch }}\">\n          <button onclick=\"{{ clearSearch }}\" style=\"border:none;background:none;cursor:pointer;color:#bdb7ab;font-size:16px;padding:0 2px\">×<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e6e2da;border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(31,29,27,.05)\">\n      <div style=\"display:grid;grid-template-columns:24px 22px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid #efece5;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.07em\">\n        <span><\u002Fspan><span><\u002Fspan><span>Task<\u002Fspan><span style=\"text-align:right\">Tags<\u002Fspan>\n      <\u002Fdiv>\n\n      <div ref=\"{{ setListEl }}\" class=\"ptm-scroll\">\n        <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n          <div data-task-row=\"\" data-id=\"{{ row.id }}\" onclick=\"{{ onRowClick }}\" style=\"{{ row.rowStyle }}\">\n            <span data-grip=\"1\" title=\"Drag to reorder\" style=\"{{ row.gripStyle }}\" style-hover=\"color:#8f887c;background:#f4f1ea\">\n              <span style=\"display:grid;grid-template-columns:1fr 1fr;gap:2.5px;width:9px\">\n                <i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi><i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi><i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi><i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi><i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi><i style=\"width:3px;height:3px;border-radius:50%;background:currentColor\"><\u002Fi>\n              <\u002Fspan>\n            <\u002Fspan>\n\n            <button onclick=\"{{ onToggle }}\" style=\"{{ row.checkStyle }}\">\n              <sc-if value=\"{{ row.done }}\"><span>✓<\u002Fspan><\u002Fsc-if>\n            <\u002Fbutton>\n\n            <span contenteditable=\"true\" onblur=\"{{ onNameBlur }}\" onkeydown=\"{{ onNameKey }}\" style=\"{{ row.nameStyle }}\" style-focus=\"background:#f4f1ea\">{{ row.name }}<\u002Fspan>\n\n            <div style=\"{{ row.tagWrapStyle }}\">\n              <sc-for list=\"{{ row.tagPills }}\" as=\"pill\" hint-placeholder-count=\"1\">\n                <span style=\"{{ pill.style }}\">{{ pill.name }}<span onclick=\"{{ onRemoveTag }}\" data-tag=\"{{ pill.name }}\" style=\"cursor:pointer;opacity:.5;font-weight:700;padding-left:1px\" style-hover=\"opacity:1\">×<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ row.showTagInput }}\">\n                <span style=\"position:relative;display:inline-block;z-index:20\" onclick=\"{{ stop }}\">\n                  <input value=\"{{ tagQuery }}\" oninput=\"{{ onTagQueryInput }}\" onkeydown=\"{{ onTagInputKey }}\" autofocus=\"\" placeholder=\"find or create…\" style=\"width:120px;border:1px solid #bdb7ab;border-radius:20px;padding:3px 9px;outline:none;font:600 11px 'JetBrains Mono',monospace;background:#fff\">\n                  <div style=\"position:absolute;top:calc(100% + 5px);right:0;background:#fff;border:1px solid #e4e0d8;border-radius:11px;box-shadow:0 12px 30px rgba(31,29,27,.18);padding:6px;min-width:158px;max-height:196px;overflow:auto;display:flex;flex-direction:column;gap:3px\">\n                    <sc-for list=\"{{ row.suggestions }}\" as=\"sg\" hint-placeholder-count=\"3\">\n                      <button onclick=\"{{ onPickSuggestion }}\" data-tag=\"{{ sg.name }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;font:600 11.5px 'JetBrains Mono',monospace;color:#4a453d\" style-hover=\"background:#f4f1ea\">\n                        <span style=\"{{ sg.dot }}\"><\u002Fspan>{{ sg.name }}\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ row.showCreate }}\">\n                      <button onclick=\"{{ onCreateTag }}\" style=\"display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;font:600 11.5px 'JetBrains Mono',monospace;color:#3a5ccc\" style-hover=\"background:#eef2fd\">+ Create \"{{ row.createLabel }}\"<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ row.emptySuggest }}\">\n                      <span style=\"padding:7px 8px;color:#b3ada2;font:500 11px 'JetBrains Mono',monospace\">All tags added<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ row.showAddBtn }}\">\n                <button onclick=\"{{ onAddTagClick }}\" title=\"Add tag\" style=\"border:1px dashed #d5d0c6;background:none;color:#b3ada2;border-radius:20px;width:20px;height:20px;cursor:pointer;font-size:13px;line-height:1;padding:0\" style-hover=\"color:#8f887c;border-color:#b3ada2\">+<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding:0 4px;font:500 12px 'JetBrains Mono',monospace;color:#a49e93\">\n      <span>{{ footLabel }}<\u002Fspan>\n      <div style=\"display:flex;gap:16px;align-items:center\">\n        <button onclick=\"{{ onImportClick }}\" title=\"Load a backup file\" style=\"border:none;background:none;cursor:pointer;font:500 12px 'JetBrains Mono',monospace;color:#a49e93;text-decoration:underline;text-underline-offset:2px\" style-hover=\"color:#22201d\">Import<\u002Fbutton>\n        <button onclick=\"{{ exportData }}\" title=\"Download a backup file\" style=\"border:none;background:none;cursor:pointer;font:500 12px 'JetBrains Mono',monospace;color:#a49e93;text-decoration:underline;text-underline-offset:2px\" style-hover=\"color:#22201d\">Export<\u002Fbutton>\n        <sc-if value=\"{{ hasDone }}\">\n          <button onclick=\"{{ clearDone }}\" style=\"border:none;background:none;cursor:pointer;font:500 12px 'JetBrains Mono',monospace;color:#a49e93;text-decoration:underline;text-underline-offset:2px\" style-hover=\"color:#22201d\">Clear completed<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <input type=\"file\" accept=\"application/json,.json\" ref=\"{{ fileRef }}\" onchange=\"{{ onImportFile }}\" style=\"display:none\">\n\n    <sc-if value=\"{{ isEmpty }}\">\n      <div style=\"text-align:center;padding:30px 0;color:#bdb7ab;font-size:13px\">{{ emptyLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ popoverOpen }}\">\n    <div onclick=\"{{ closeTagPopover }}\" style=\"position:fixed;inset:0;z-index:15\"><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ syncOpen }}\">\n    <div onclick=\"{{ closeSync }}\" style=\"position:fixed;inset:0;background:rgba(31,29,27,.34);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 40px;z-index:80;overflow:auto\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(480px,94vw);background:#fff;border-radius:16px;box-shadow:0 26px 64px rgba(31,29,27,.3);padding:24px\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:4px\">\n          <span style=\"{{ syncDotStyle }}\"><\u002Fspan>\n          <h2 style=\"margin:0;font:700 18px 'Public Sans',sans-serif;letter-spacing:-.01em;color:#22201d\">Sync with GitHub<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font:400 13px 'Public Sans',sans-serif;color:#8f887c;line-height:1.5\">Your tasks are saved to a file in your GitHub repo, so every device with the same repo and token stays in step.<\u002Fp>\n\n        <label style=\"display:block;font:600 11px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">Personal access token<\u002Flabel>\n        <input value=\"{{ ghTokenDraft }}\" oninput=\"{{ onTokenInput }}\" type=\"password\" placeholder=\"ghp_… or github_pat_…\" style=\"width:100%;padding:10px 12px;border:1px solid #ddd8ce;border-radius:10px;outline:none;font:500 13px 'JetBrains Mono',monospace;color:#22201d;background:#faf9f6\" style-focus=\"border-color:#bdb7ab;background:#fff\">\n        <p style=\"margin:7px 2px 16px;font:400 11.5px 'Public Sans',sans-serif;color:#a49e93;line-height:1.5\">Create one at <span style=\"color:#3a5ccc\">github.com/settings/tokens<\u002Fspan> with read/write access to <b>Contents<\u002Fb> for this repo. It's stored only on this device.<\u002Fp>\n\n        <label style=\"display:block;font:600 11px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">Data repo — where your tasks are saved<\u002Flabel>\n        <p style=\"margin:0 0 9px 2px;font:400 11.5px 'Public Sans',sans-serif;color:#a49e93;line-height:1.5\">This can be a <b>private<\u002Fb> repo so your task list stays hidden. It's separate from the public repo that hosts the app.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px\">\n          <div><label style=\"display:block;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Owner<\u002Flabel><input value=\"{{ ghOwner }}\" data-k=\"owner\" oninput=\"{{ onConfigField }}\" style=\"width:100%;padding:8px 10px;border:1px solid #ddd8ce;border-radius:9px;outline:none;font:500 12px 'JetBrains Mono',monospace;background:#faf9f6\"><\u002Fdiv>\n          <div><label style=\"display:block;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Repo<\u002Flabel><input value=\"{{ ghRepo }}\" data-k=\"repo\" oninput=\"{{ onConfigField }}\" style=\"width:100%;padding:8px 10px;border:1px solid #ddd8ce;border-radius:9px;outline:none;font:500 12px 'JetBrains Mono',monospace;background:#faf9f6\"><\u002Fdiv>\n          <div><label style=\"display:block;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Branch<\u002Flabel><input value=\"{{ ghBranch }}\" data-k=\"branch\" oninput=\"{{ onConfigField }}\" style=\"width:100%;padding:8px 10px;border:1px solid #ddd8ce;border-radius:9px;outline:none;font:500 12px 'JetBrains Mono',monospace;background:#faf9f6\"><\u002Fdiv>\n          <div><label style=\"display:block;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">File path<\u002Flabel><input value=\"{{ ghPath }}\" data-k=\"path\" oninput=\"{{ onConfigField }}\" style=\"width:100%;padding:8px 10px;border:1px solid #ddd8ce;border-radius:9px;outline:none;font:500 12px 'JetBrains Mono',monospace;background:#faf9f6\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f7f5f1;border-radius:11px;margin-bottom:16px\">\n          <span onclick=\"{{ toggleAuto }}\" style=\"{{ autoDotStyle }}\"><span style=\"{{ autoKnobStyle }}\"><\u002Fspan><\u002Fspan>\n          <div><div style=\"font:600 13px 'Public Sans',sans-serif;color:#22201d\">Auto-sync<\u002Fdiv><div style=\"font:400 11.5px 'Public Sans',sans-serif;color:#a49e93\">Push changes to GitHub automatically<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ syncMsg }}\">\n          <p style=\"margin:0 0 14px;font:600 12px 'JetBrains Mono',monospace;color:{{ syncStatusColor }};line-height:1.5\">{{ syncMsg }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;align-items:center\">\n          <sc-if value=\"{{ ghConnected }}\">\n            <button onclick=\"{{ pullNow }}\" style=\"padding:9px 15px;background:#fff;border:1px solid #e2ded5;border-radius:10px;font:600 12.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer\" style-hover=\"background:#f4f1ea\">↓ Pull now<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ghConnected }}\">\n            <button onclick=\"{{ pushNow }}\" style=\"{{ modalSubmitStyle }}\">↑ Push now<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ghNotConnected }}\">\n            <button onclick=\"{{ connectGh }}\" style=\"{{ modalSubmitStyle }}\">Connect &amp; pull<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ghConnected }}\">\n            <button onclick=\"{{ connectGh }}\" title=\"Save an updated token\" style=\"padding:9px 15px;background:#fff;border:1px solid #e2ded5;border-radius:10px;font:600 12.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer\" style-hover=\"background:#f4f1ea\">Update token<\u002Fbutton>\n          <\u002Fsc-if>\n          <span style=\"margin-left:auto;font:500 11px 'JetBrains Mono',monospace;color:#b3ada2\">{{ lastSyncLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ ghConnected }}\">\n          <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #efece5;display:flex;justify-content:space-between;align-items:center\">\n            <button onclick=\"{{ disconnectGh }}\" style=\"border:none;background:none;cursor:pointer;font:600 12px 'Public Sans',sans-serif;color:#b0432f\" style-hover=\"text-decoration:underline\">Disconnect<\u002Fbutton>\n            <button onclick=\"{{ closeSync }}\" style=\"border:none;background:none;cursor:pointer;font:600 12px 'Public Sans',sans-serif;color:#8f887c\" style-hover=\"color:#22201d\">Close<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tagsOpen }}\">\n    <div style=\"position:fixed;inset:0;background:#f6f4ef;z-index:70;overflow:auto\">\n      <div style=\"max-width:620px;margin:0 auto;padding:28px 18px 60px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n          <button onclick=\"{{ closeTags }}\" title=\"Back to tasks\" style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:#fff;border:1px solid #e6e2da;border-radius:10px;font:600 12.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer\" style-hover=\"background:#f4f1ea\">← Tasks<\u002Fbutton>\n          <h1 style=\"margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em\">Manage tags<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-bottom:20px\">\n          <input value=\"{{ newTagName }}\" oninput=\"{{ onNewTagInput }}\" onkeydown=\"{{ onNewTagKey }}\" placeholder=\"New tag name…\" style=\"flex:1;padding:10px 13px;background:#fff;border:1px solid #e6e2da;border-radius:11px;outline:none;font:600 13px 'JetBrains Mono',monospace;color:#22201d\" style-focus=\"border-color:#bdb7ab\">\n          <button onclick=\"{{ addTag }}\" style=\"{{ addBtnStyle }}\"><span style=\"font-size:16px;line-height:1;margin-top:-1px\">+<\u002Fspan> Add tag<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #e6e2da;border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(31,29,27,.05)\">\n          <div style=\"padding:10px 15px;border-bottom:1px solid #efece5;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.07em\">Active<\u002Fdiv>\n          <sc-for list=\"{{ activeTags }}\" as=\"tg\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid #f1eee8\">\n              <span style=\"{{ tg.dot }}\"><\u002Fspan>\n              <span style=\"font:600 13px 'JetBrains Mono',monospace;color:#22201d\">{{ tg.name }}<\u002Fspan>\n              <span style=\"font:500 11px 'JetBrains Mono',monospace;color:#b3ada2\">{{ tg.countLabel }}<\u002Fspan>\n              <span style=\"margin-left:auto;display:flex;gap:7px\">\n                <button onclick=\"{{ toggleArchive }}\" data-tag=\"{{ tg.name }}\" style=\"padding:5px 11px;background:#fff;border:1px solid #e2ded5;border-radius:8px;font:600 11.5px 'Public Sans',sans-serif;color:#6b655b;cursor:pointer\" style-hover=\"background:#f4f1ea\">Archive<\u002Fbutton>\n                <button onclick=\"{{ deleteTag }}\" data-tag=\"{{ tg.name }}\" style=\"padding:5px 11px;background:#fff;border:1px solid #eed6d2;border-radius:8px;font:600 11.5px 'Public Sans',sans-serif;color:#b0432f;cursor:pointer\" style-hover=\"background:#faf0ee\">Delete<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noActiveTags }}\">\n            <div style=\"padding:20px 15px;text-align:center;color:#bdb7ab;font-size:13px\">No active tags — add one above.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasArchived }}\">\n          <div style=\"background:#fff;border:1px solid #e6e2da;border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(31,29,27,.05);margin-top:18px\">\n            <div style=\"padding:10px 15px;border-bottom:1px solid #efece5;font:600 10px 'JetBrains Mono',monospace;color:#b3ada2;text-transform:uppercase;letter-spacing:.07em\">Archived<\u002Fdiv>\n            <sc-for list=\"{{ archivedTags }}\" as=\"tg\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid #f1eee8;opacity:.62\">\n                <span style=\"{{ tg.dot }}\"><\u002Fspan>\n                <span style=\"font:600 13px 'JetBrains Mono',monospace;color:#22201d\">{{ tg.name }}<\u002Fspan>\n                <span style=\"font:500 11px 'JetBrains Mono',monospace;color:#b3ada2\">{{ tg.countLabel }}<\u002Fspan>\n                <span style=\"margin-left:auto;display:flex;gap:7px\">\n                  <button onclick=\"{{ toggleArchive }}\" data-tag=\"{{ tg.name }}\" style=\"padding:5px 11px;background:#fff;border:1px solid #e2ded5;border-radius:8px;font:600 11.5px 'Public Sans',sans-serif;color:#4a453d;cursor:pointer\" style-hover=\"background:#f4f1ea\">Restore<\u002Fbutton>\n                  <button onclick=\"{{ deleteTag }}\" data-tag=\"{{ tg.name }}\" style=\"padding:5px 11px;background:#fff;border:1px solid #eed6d2;border-radius:8px;font:600 11.5px 'Public Sans',sans-serif;color:#b0432f;cursor:pointer\" style-hover=\"background:#faf0ee\">Delete<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <p style=\"margin:16px 4px 0;font:500 12px 'JetBrains Mono',monospace;color:#a49e93;line-height:1.6\">Archived tags stay on their tasks but won't appear as suggestions. Deleting a tag removes it from every task.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modalOpen }}\">\n    <div onclick=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(31,29,27,.34);display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:60\">\n      <div onclick=\"{{ stop }}\" style=\"width:min(430px,92vw);background:#fff;border-radius:16px;box-shadow:0 26px 64px rgba(31,29,27,.3);padding:24px 24px 20px\">\n        <h2 style=\"margin:0 0 3px;font:700 18px 'Public Sans',sans-serif;letter-spacing:-.01em;color:#22201d\">New task<\u002Fh2>\n        <p style=\"margin:0 0 16px;font:400 13px 'Public Sans',sans-serif;color:#8f887c\">Give your task a name.<\u002Fp>\n        <input value=\"{{ modalName }}\" oninput=\"{{ onModalInput }}\" onkeydown=\"{{ onModalKey }}\" autofocus=\"\" placeholder=\"e.g. Prepare Monday standup\" style=\"width:100%;padding:11px 13px;border:1px solid #ddd8ce;border-radius:10px;outline:none;font:500 15px 'Public Sans',sans-serif;color:#22201d;background:#faf9f6\" style-focus=\"border-color:#bdb7ab;background:#fff\">\n        <sc-if value=\"{{ hasModalHint }}\">\n          <p style=\"margin:11px 2px 0;font:500 12px 'JetBrains Mono',monospace;color:#a49e93\">↳ {{ modalHint }}<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:flex-end;gap:9px;margin-top:18px\">\n          <button onclick=\"{{ closeModal }}\" style=\"padding:9px 16px;border:1px solid #e2ded5;background:#fff;border-radius:10px;font:600 13px 'Public Sans',sans-serif;color:#6b655b;cursor:pointer\" style-hover=\"background:#f4f1ea\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ submitModal }}\" style=\"{{ modalSubmitStyle }}\">Add task<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:620},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c1762a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4b57d6&quot;,&quot;#0d8f6f&quot;,&quot;#c1762a&quot;,&quot;#b23b5e&quot;]},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;]},&quot;hideCompleted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.listRef = React.createRef();\n    this.fileRef = React.createRef();\n    this.PALETTE = [\n      {fg:'#3a5ccc',bg:'#eef2fd',br:'#cdd8f7'},\n      {fg:'#0d8f6f',bg:'#e8f6f0',br:'#c4e8db'},\n      {fg:'#c1762a',bg:'#faf1e3',br:'#ecd8ba'},\n      {fg:'#a0459b',bg:'#f9edf7',br:'#ecccea'},\n      {fg:'#4b7a2b',bg:'#eef5e6',br:'#d3e6c2'},\n      {fg:'#b23b5e',bg:'#fbedf1',br:'#f0cdd8'}\n    ];\n    const tasks = this.load() || [\n      {id:this.uid(), name:'Draft Q3 planning doc', tags:['work'], done:false},\n      {id:this.uid(), name:'Reply to landlord email', tags:['home'], done:false},\n      {id:this.uid(), name:'Book dentist appointment', tags:['home','errand'], done:false},\n      {id:this.uid(), name:'Review pull request #482', tags:['work'], done:false},\n      {id:this.uid(), name:'Renew gym membership', tags:['errand'], done:true},\n      {id:this.uid(), name:'Plan weekend hike', tags:['personal'], done:false}\n    ];\n    const savedTags = this.loadTags();\n    const tags = savedTags || [...new Set(tasks.flatMap(t=>t.tags))].map(name=>({name, archived:false}));\n    let cfg; try{ cfg=JSON.parse(localStorage.getItem('ptm.gh.config')||'null'); }catch(e){ cfg=null; }\n    cfg = cfg || {owner:'baltazar164', repo:'TaskTable-data', branch:'main', path:'tasks.json'};\n    const token = localStorage.getItem('ptm.gh.token') || '';\n    this.state = {\n      tasks, tags,\n      search:'', dragId:null, tagInputId:null, tagQuery:'',\n      modalOpen:false, modalName:'', selectedId:null,\n      tagsOpen:false, newTagName:'',\n      syncOpen:false, ghToken:token, ghTokenDraft:token, ghConfig:cfg, ghSha:null,\n      autoSync: localStorage.getItem('ptm.gh.auto')!=='0',\n      lastSync: localStorage.getItem('ptm.gh.lastsync')||'',\n      syncStatus:'', syncMsg:'',\n      narrow: (typeof window!=='undefined' && window.innerWidth < 560)\n    };\n    this._onResize = () => { const n = window.innerWidth < 560; if(n!==this.state.narrow) this.setState({narrow:n}); };\n    if(typeof window!=='undefined') window.addEventListener('resize', this._onResize);\n  }\n  loadTags(){ try{ const r=localStorage.getItem('ptm.tags.v1'); return r?JSON.parse(r):null; }catch(e){ return null; } }\n  saveTags(tags){ try{ localStorage.setItem('ptm.tags.v1', JSON.stringify(tags)); }catch(e){} this.scheduleAutoPush(); }\n  uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }\n  load(){ try{ const r=localStorage.getItem('ptm.tasks.v2'); return r?JSON.parse(r):null; }catch(e){ return null; } }\n  save(tasks){ try{ localStorage.setItem('ptm.tasks.v2', JSON.stringify(tasks)); }catch(e){} this.scheduleAutoPush(); }\n  commit(tasks, extra){ this.save(tasks); this.setState(Object.assign({tasks}, extra||{})); }\n\n  // ---- GitHub sync ----\n  apiUrl(){ const c=this.state.ghConfig; const path=c.path.split('/').map(encodeURIComponent).join('/'); return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`; }\n  ghHeaders(){ return { Authorization:`Bearer ${this.state.ghToken}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }\n  scheduleAutoPush(){ if(this._applyingRemote) return; if(!this.state.autoSync || !this.state.ghToken) return; clearTimeout(this._pushT); this._pushT=setTimeout(()=>this.push(true), 1600); }\n\n  openSync = () => this.setState({syncOpen:true, ghTokenDraft:this.state.ghToken, syncMsg:'', syncStatus:''});\n  closeSync = () => this.setState({syncOpen:false});\n  onTokenInput = e => this.setState({ghTokenDraft:e.target.value});\n  onConfigField = e => { const k=e.currentTar )).length;\n    const tagRow = g => { const c=this.tagColor(g.name); const n=counts(g.name); return {name:g.name, dot:`width:11px;height:11px;border-radius:50%;flex:none;background:${c.fg}`, countLabel:`${n} task${n===1?'':'s'}`}; };\n    const activeTags = reg.filter(g=>!g.archived).map(tagRow);\n    const archivedTags = reg.filter(g=>g.archived).map(tagRow);\n\n    const total=this.state.tasks.length;\n    const done=this.state.tasks.filter(t=>t.done).length;\n    const addBtnStyle=`display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:${accent};color:#fff;border:none;border-radius:11px;font:600 13px 'Public Sans',sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(31,29,27,.1)`;\n    const sel = this.state.tasks.find(t=>t.id===this.state.selectedId);\n    const modalHint = sel ? `Adds below \"${sel.name.length>34?sel.name.slice(0,34)+'…':sel.name}\"` : '';\n    const modalSubmitStyle=`padding:9px 18px;background:${accent};color:#fff;border:none;border-radius:10px;font:600 13px 'Public Sans',sans-serif;cursor:pointer`;\n    return {\n      rows,\n      search:this.state.search, hasSearch:this.state.search.length>0, clearSearch:this.clearSearch,\n      modalOpen:this.state.modalOpen, modalName:this.state.modalName, addBtnStyle, modalSubmitStyle,\n      modalHint, hasModalHint:!!sel, onRowClick:this.onRowClick,\n      openModal:this.openModal, closeModal:this.closeModal, stop:this.stop, onModalInput:this.onModalInput, submitModal:this.submitModal, onModalKey:this.onModalKey,\n      tagQuery:this.state.tagQuery, popoverOpen:this.state.tagInputId!==null,\n      onTagQueryInput:this.onTagQueryInput, onPickSuggestion:this.onPickSuggestion, onCreateTag:this.onCreateTag, closeTagPopover:this.closeTagPopover,\n      tagsOpen:this.state.tagsOpen, openTags:this.openTags, closeTags:this.closeTags,\n      newTagName:this.state.newTagName, onNewTagInput:this.onNewTagInput, onNewTagKey:this.onNewTagKey, addTag:this.addTag,\n      toggleArchive:this.toggleArchive, deleteTag:this.deleteTag,\n      activeTags, archivedTags, noActiveTags:activeTags.length===0, hasArchived:archivedTags.length>0,\n      exportData:this.exportData, onImportClick:this.onImportClick, onImportFile:this.onImportFile, fileRef:this.fileRef,\n      syncOpen:this.state.syncOpen, openSync:this.openSync, closeSync:this.closeSync,\n      ghConnected:!!this.state.ghToken, ghNotConnected:!this.state.ghToken, ghTokenDraft:this.state.ghTokenDraft, onTokenInput:this.onTokenInput,\n      connectGh:this.connectGh, disconnectGh:this.disconnectGh,\n      ghOwner:this.state.ghConfig.owner, ghRepo:this.state.ghConfig.repo, ghBranch:this.state.ghConfig.branch, ghPath:this.state.ghConfig.path,\n      onConfigField:this.onConfigField, autoSync:this.state.autoSync, toggleAuto:this.toggleAuto,\n      pullNow:()=>this.pull(), pushNow:()=>this.push(false),\n      syncBusy:this.state.syncStatus==='busy', syncStatusColor: this.state.syncStatus==='error'?'#b0432f':(this.state.syncStatus==='ok'?'#0d8f6f':'#a49e93'),\n      syncMsg:this.state.syncMsg, lastSyncLabel: this.state.lastSync?('Last synced '+new Date(this.state.lastSync).toLocaleString()):'Not synced yet',\n      syncDotStyle:`width:8px;height:8px;border-radius:50%;flex:none;background:${this.state.ghToken?'#0d8f6f':'#cbc6bb'}`,\n      autoDotStyle:`display:inline-flex;align-items:center;width:34px;height:20px;border-radius:20px;padding:2px;background:${this.state.autoSync?accent:'#d5d0c6'};cursor:pointer;transition:background .15s`,\n      autoKnobStyle:`width:16px;height:16px;border-radius:50%;background:#fff;transform:translateX(${this.state.autoSync?'14px':'0'});transition:transform .15s`,\n      countLabel:`${total} task${total===1?'':'s'} · ${done} done`,\n      footLabel:`${total-done} remaining`,\n      hasDone: done>0, isEmpty: rows.length===0,\n      emptyLabel: q ? 'No tasks match your search.' : 'No tasks yet — add one below.',\n      listRef:this.listRef, setListEl:this.setListEl,\n      onSearch:this.onSearch, onToggle:this.onToggle, onDelete:this.onDelete,\n      onNewInput:this.onNewInput, onNewKey:this.onNewKey,\n      onNameBlur:this.onNameBlur, onNameKey:this.onNameKey,\n      onGripDown:this.onGripDown, clearDone:this.clearDone,\n      onAddTagClick:this.onAddTagClick, onTagInputKey:this.onTagInputKey, onTagInputBlur:this.onTagInputBlur, onRemoveTag:this.onRemoveTag\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
